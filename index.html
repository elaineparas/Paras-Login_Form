<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h1>Welcome Back!</h1>
        <p class="subtitle">Please enter your details</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username">
                <small class="error-msg" id="userError"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">
                <small class="error-msg" id="passError"></small>
            </div>

            <div class="form-options">
                <label><input type="checkbox"> Remember Me</label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" id="loginBtn">Log In</button>
            <div id="successMsg" class="success-msg"></div>
        </form>

        <div class="divider">
            <span>Or log in with</span>
        </div>

        <div class="social-login">
            <button class="social-btn" link src="https://myaccount.google.com"><img src="assets/google.png" alt="Google"></button>
            <button class="social-btn" link src="https://www.facebook.com"><img src="assets/fb.png" alt="Facebook"></button>
        </div>

        <p class="signup-link">Don't have an account? <a href="#">Sign Up</a></p>
    </div>

    <footer>
        <p>&copy; 2026 Elaine L. Paras. BSIT 2B.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
